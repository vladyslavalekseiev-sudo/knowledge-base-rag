name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-qa.txt
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m ruff check rag tests evaluation
      - run: python -m pytest -W error -q --cov=rag --cov-branch --cov-fail-under=90
      - run: python -m pip_audit
      - run: python -m evaluation.run
      - run: node --check web/app.js
      - name: Check container startup
        id: container
        run: |
          docker build -t relay-knowledge .
          docker run -d --name relay-knowledge -p 127.0.0.1:8000:8000 relay-knowledge
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --retry-max-time 45 --max-time 5 http://127.0.0.1:8000/api/health
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          request = Request(
              'http://127.0.0.1:8000/api/ask',
              data=json.dumps({'question': 'How long do webhook retries continue?'}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          with urlopen(request, timeout=5) as response:
              answer = json.load(response)
          assert answer['status'] == 'answered', answer
          assert '24 hours' in answer['answer'], answer
          assert answer['citations'][0]['id'] == 'webhooks/delivery-retries/1', answer
          print('Container API smoke test passed.')
          PY
      - if: failure() && steps.container.outcome == 'failure'
        run: docker logs relay-knowledge
      - if: always()
        run: docker rm -f relay-knowledge || true
