name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -W error -q
      - run: python -m evaluation.run
      - run: node --check web/app.js
      - name: Check container startup
        id: container
        run: |
          docker build -t relay-knowledge .
          docker run -d --name relay-knowledge -p 127.0.0.1:8000:8000 relay-knowledge
          curl --fail --retry 10 --retry-connrefused http://127.0.0.1:8000/api/health
      - if: failure() && steps.container.outcome == 'failure'
        run: docker logs relay-knowledge
